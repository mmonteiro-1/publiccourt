<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Campo Livre</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
	<link rel="stylesheet" href="css/styles.css">
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#e6b5b2">
	<script defer src="/_vercel/insights/script.js"></script>
</head>

<body class="page-dashboard">

	<header>
		<div class="logo">
			<span>CAMPO</span>
			<img src="images/pig.svg" class="logo-pig" alt="">
			<span>LIVRE</span>
		</div>
	</header>

	<div class="toolbar">
		<div class="view-toggle" id="viewToggle">
			<button class="view-toggle-btn active" data-view="list" aria-label="Show list view" aria-pressed="true">
				<img src="images/icon_list.svg" alt="">
			</button>
			<button class="view-toggle-btn" data-view="map" aria-label="Show map view" aria-pressed="false">
				<img src="images/icon_map.svg" alt="">
			</button>
		</div>
		<div class="filter-tags" id="filterTags"></div>
	</div>

	<div class="grid" id="grid" aria-live="polite">
		<p class="empty">A carregar campos...</p>
	</div>

	<div id="map" hidden></div>

	<a class="info-link" href="info.html">
		<img src="images/icon_info.svg" class="link-icon" alt="">
		Como funciona o Campo Livre
	</a>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
	<script src="js/config.js"></script>
	<script src="js/utils.js"></script>
	<script src="js/dashboard.js"></script>
	<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/service-worker.js");</script>

</body>

</html>
