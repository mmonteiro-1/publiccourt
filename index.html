<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PublicCourt</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
	<link rel="stylesheet" href="css/styles.css">
</head>

<body class="page-dashboard">

	<header>
		<div class="logo">Public<span>Court</span></div>
	</header>

	<div class="toolbar">
		<div class="filter-tags" id="filterTags"></div>
		<div class="view-toggle" id="viewToggle">
			<button class="view-toggle-btn active" data-view="list" aria-label="Show list view" aria-pressed="true">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
					<line x1="4" y1="6" x2="20" y2="6"></line>
					<line x1="4" y1="12" x2="20" y2="12"></line>
					<line x1="4" y1="18" x2="20" y2="18"></line>
				</svg>
			</button>
			<button class="view-toggle-btn" data-view="map" aria-label="Show map view" aria-pressed="false">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"></path>
					<circle cx="12" cy="10" r="2.5"></circle>
				</svg>
			</button>
		</div>
	</div>

	<div class="grid" id="grid" aria-live="polite">
		<p class="empty">Loading courts...</p>
	</div>

	<div id="map" hidden></div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
	<script src="js/config.js"></script>
	<script src="js/utils.js"></script>
	<script src="js/dashboard.js"></script>

</body>

</html>
