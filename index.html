<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PublicCourt</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
	<link rel="stylesheet" href="css/styles.css">
</head>

<body class="page-dashboard">

	<header>
		<div class="logo">Public<span>Court</span></div>
		<div class="refresh-indicator">
			<div class="refresh-dot" id="rdot"></div>
			<span id="refresh-label">Updating...</span>
		</div>
	</header>

	<div class="grid" id="grid" aria-live="polite">
		<p class="empty">Loading courts...</p>
	</div>

	<p class="map-heading">Court locations</p>
	<div id="map"></div>

	<footer>Auto-refreshes every 30 seconds</footer>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
	<script src="js/config.js"></script>
	<script src="js/utils.js"></script>
	<script src="js/dashboard.js"></script>

</body>

</html>
