<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PublicCourt</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
	<style>
		:root {
			--bg: #0D1F12;
			--surface: #142018;
			--border: #1E3525;
			--text: #E8F5EC;
			--muted: #6B9275;
			--available: #4ADE80;
			--available-bg: #0F2E1A;
			--inuse: #FBBF24;
			--inuse-bg: #2A1E00;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Inter', -apple-system, sans-serif;
			background: var(--bg);
			color: var(--text);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			padding: 32px 24px;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 40px;
		}

		.logo {
			font-size: 18px;
			font-weight: 800;
			letter-spacing: -0.02em;
			color: var(--text);
		}

		.logo span {
			color: var(--available);
		}

		.refresh-indicator {
			font-size: 12px;
			font-weight: 500;
			color: var(--muted);
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.refresh-dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: var(--muted);
		}

		.refresh-dot.active {
			background: var(--available);
			animation: pulse 1s ease-in-out 3;
		}

		@keyframes pulse {

			0%,
			100% {
				opacity: 1
			}

			50% {
				opacity: .3
			}
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 20px;
			flex: 1;
		}

		.court-card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 20px;
			padding: 28px;
			display: flex;
			flex-direction: column;
			gap: 0;
			transition: border-color 0.3s;
		}

		.court-card.available {
			border-color: #1E3525;
		}

		.court-card.inuse {
			border-color: #3A2800;
		}

		.court-number {
			font-size: 11px;
			font-weight: 600;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			color: var(--muted);
			margin-bottom: 20px;
		}

		.badge-row {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin-bottom: 20px;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			padding: 6px 13px;
			border-radius: 100px;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			width: fit-content;
		}

		.badge.available {
			background: var(--available-bg);
			color: var(--available);
			margin-bottom: 20px;
		}

		.badge.inuse {
			background: var(--inuse-bg);
			color: var(--inuse);
		}

		.badge.time {
			background: var(--border);
			color: var(--muted);
		}

		.dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: currentColor;
		}

		.dot.blink {
			animation: blink 2s ease-in-out infinite;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1
			}

			50% {
				opacity: .25
			}
		}

		.card-status {
			font-size: 32px;
			font-weight: 800;
			letter-spacing: -0.02em;
			line-height: 1.1;
			margin-bottom: 8px;
			font-variant-numeric: tabular-nums;
		}

		.card-status.available {
			color: var(--text);
		}

		.card-status.inuse {
			color: var(--inuse);
		}

		.card-sub {
			font-size: 14px;
			color: var(--muted);
			line-height: 1.5;
		}

		.empty {
			text-align: center;
			color: var(--muted);
			font-size: 15px;
			padding: 60px 0;
		}

		footer {
			margin-top: 40px;
			font-size: 12px;
			color: var(--border);
			text-align: center;
		}
	</style>
</head>

<body>

	<header>
		<div class="logo">Public<span>Court</span></div>
		<div class="refresh-indicator">
			<div class="refresh-dot" id="rdot"></div>
			<span id="refresh-label">Updating...</span>
		</div>
	</header>

	<div class="grid" id="grid">
		<p class="empty">Loading courts...</p>
	</div>

	<footer>Auto-refreshes every 30 seconds</footer>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script>
		const SUPABASE_URL = "https://xfshczzojvbkfxkmsvsn.supabase.co";
		const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhmc2hjenpvanZia2Z4a21zdnNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTA3NDEsImV4cCI6MjEwMzkyNjc0MX0.J3LYlMo37rlX5MVswjtCv_r-lO8_6UiuXAVZMM1WwNI";

		const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
		const grid = document.getElementById("grid");
		const rdot = document.getElementById("rdot");
		const label = document.getElementById("refresh-label");

		// MINUTES REMAINING UNTIL A RESERVATION ENDS
		function minutesLeft(endsAt) {
			const ms = new Date(endsAt) - Date.now();
			return Math.max(0, Math.ceil(ms / 60000));
		}

		// FORMAT A TIMESTAMP AS HH:MM
		function formatTime(ts) {
			return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
		}

		// LOAD ALL COURTS AND THEIR ACTIVE RESERVATIONS
		async function load() {
			const now = new Date().toISOString();

			const [{ data: courts }, { data: reservations }] = await Promise.all([
				db.from("courts").select("*").order("id"),
				db.from("reservations").select("*").is("manual_finished_at", null).gt("ends_at", now),
			]);

			if (!courts || courts.length === 0) {
				grid.innerHTML = `<p class="empty">No courts found.</p>`;
				return;
			}

			const activeMap = {};
			(reservations || []).forEach(r => { activeMap[r.court_id] = r; });

			grid.innerHTML = courts.map(court => {
				const res = activeMap[court.id];
				if (res) {
					const mins = minutesLeft(res.ends_at);
					return `
          <div class="court-card inuse">
            <p class="court-number">${court.name}</p>
            <div class="badge-row">
              <span class="badge inuse"><span class="dot blink"></span> In use</span>
              <span class="badge time">Started ${formatTime(res.started_at)}</span>
              <span class="badge time">Ends ${formatTime(res.ends_at)}</span>
            </div>
            <p class="card-status inuse">${mins > 0 ? `${mins}m left` : "Ending"}</p>
          </div>
        `;
				} else {
					return `
          <div class="court-card available">
            <p class="court-number">${court.name}</p>
            <span class="badge available"><span class="dot"></span> Available</span>
            <p class="card-status available">Ready</p>
            <p class="card-sub">Scan the QR code to check in</p>
          </div>
        `;
				}
			}).join("");

			rdot.classList.remove("active");
			void rdot.offsetWidth;
			rdot.classList.add("active");
			label.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
		}

		load();
		setInterval(load, 30000);
	</script>

</body>

</html>
