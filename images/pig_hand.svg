<!-- TWO GROUPS ON ONE ARTBOARD, DRAWN SEPARATELY ON THE PAGE WITH <use href="images/pig_hand.svg#hand"> / "#thumb" SO A PRIZE
     CAN SIT BETWEEN THEM: #hand (FOREARM, CUFF, PALM, FINGERS) GOES BEHIND IT, #thumb IN FRONT. <use> IGNORES ANCESTORS'
     TRANSFORMS, SO EACH GROUP CARRIES THE WHOLE TRANSFORM ITSELF — THE EXPORT'S TWO WRAPPERS, translate(2067.152092,
     1065.931093) THEN matrix(3.802155,0,0,3.802155,-2661,-1669.20946), FOLDED INTO ONE. KEEP IT THAT WAY WHEN RE-EXPORTING -->
