<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 1024"><style>* { animation: none !important; }</style>
  <defs>
    <style>
      .cls-1 {
        fill: #ffdd71;
      }

      .cls-2 {
        fill: #ffc700;
      }

      .cls-3 {
        clip-path: url(#clippath);
      }

      /* THE ADMIN PAGE'S WIGGLE (styles.css), LOOPING. 8 UNITS HERE IS ABOUT ITS 2px ONCE THE ART IS SHRUNK TO THE CARD.
         THREE OFFSETS SO THE BLOBS DON'T SHAKE AS ONE BLOCK */
      path.cls-1 {
        animation: wiggle 450ms linear infinite;
      }

      path.cls-1:nth-child(3n+2) {
        animation-delay: -150ms;
      }

      path.cls-1:nth-child(3n) {
        animation-delay: -300ms;
      }

      @keyframes wiggle {
        0%, 20%, 40%, 60%, 80% { transform: translate(8px, 0); }
        10%, 30%, 50%, 70%, 90% { transform: translate(-8px, 0); }
        100% { transform: translate(0, 0); }
      }

      @media (prefers-reduced-motion: reduce) {
        path.cls-1 {
          animation: none;
        }
      }
    </style>
    <clipPath id="clippath">
      <rect class="cls-2" width="1280" height="1024"/>
    </clipPath>
