<!DOCTYPE html>
<html lang="pt">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Campo Livre — Gestor</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/styles.css">
</head>

<body class="page-owner">

	<header>
		<div class="logo">
			<span>CAMPO</span>
			<img src="images/pig.svg" class="logo-pig" alt="">
			<span>LIVRE</span>
		</div>
		<button id="logout-btn" class="owner-logout">Sair</button>
	</header>

	<main id="app">
		<p class="form-sent" id="loading-msg">A carregar...</p>

		<div id="view-pending" class="owner-view" hidden></div>
		<div id="view-members" class="owner-view" hidden></div>
		<div id="view-rules" class="owner-view" hidden></div>
	</main>

	<nav class="owner-nav" hidden>
		<button class="owner-nav-btn active" data-view="pending"><img src="images/icon_asking.svg" alt="">Pendentes</button>
		<button class="owner-nav-btn" data-view="members"><img src="images/icon_shelter.svg" alt="">Membros</button>
		<button class="owner-nav-btn" data-view="rules"><img src="images/icon_gear.svg" alt="">Campo</button>
	</nav>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script src="js/config.js"></script>
	<script src="js/utils.js"></script>
	<script src="js/owner.js"></script>

</body>

</html>
